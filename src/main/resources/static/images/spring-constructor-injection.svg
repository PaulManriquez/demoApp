<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">Spring Constructor Injection Infographic</title>
  <desc id="desc">A simple infographic explaining that a Spring class with one constructor does not need the Autowired annotation.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f7f1"/>
      <stop offset="100%" stop-color="#dcefd8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="1400" fill="url(#bg)"/>
  <circle cx="1220" cy="130" r="170" fill="#9ad08f" opacity="0.18"/>
  <circle cx="160" cy="1240" r="200" fill="#6dbb5a" opacity="0.12"/>

  <text x="90" y="115" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#17351c">
    Spring Constructor Injection
  </text>
  <text x="90" y="165" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#35563b">
    If a Spring bean has one constructor, @Autowired is optional.
  </text>

  <g filter="url(#shadow)">
    <rect x="90" y="240" rx="28" ry="28" width="560" height="580" fill="url(#panel)"/>
    <rect x="750" y="240" rx="28" ry="28" width="560" height="580" fill="url(#panel)"/>
  </g>

  <text x="140" y="315" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#8d1f1f">
    Works, but redundant
  </text>
  <text x="800" y="315" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1d6b2b">
    Preferred modern style
  </text>

  <rect x="135" y="350" rx="18" ry="18" width="470" height="320" fill="#1f2430"/>
  <rect x="795" y="350" rx="18" ry="18" width="470" height="320" fill="#1f2430"/>

  <text x="160" y="405" font-family="Courier New, monospace" font-size="26" fill="#ff7b72">
    @Autowired
  </text>
  <text x="160" y="445" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
    public BranchController(
  </text>
  <text x="160" y="485" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      BranchService branchService,
  </text>
  <text x="160" y="525" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      UserService userService) {
  </text>
  <text x="160" y="565" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      this.branchService = branchService;
  </text>
  <text x="160" y="605" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      this.userService = userService;
  </text>
  <text x="160" y="645" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
    }
  </text>

  <text x="820" y="405" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
    public BranchController(
  </text>
  <text x="820" y="445" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      BranchService branchService,
  </text>
  <text x="820" y="485" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      UserService userService) {
  </text>
  <text x="820" y="525" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      this.branchService = branchService;
  </text>
  <text x="820" y="565" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
      this.userService = userService;
  </text>
  <text x="820" y="605" font-family="Courier New, monospace" font-size="26" fill="#c9d1d9">
    }
  </text>

  <circle cx="700" cy="530" r="56" fill="#2f7d32"/>
  <path d="M676 530 L694 548 L726 512" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="140" y="745" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5a2a2a">
    Spring still injects dependencies here because the bean has a single constructor.
  </text>
  <text x="800" y="745" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#244b29">
    Cleaner code. Same behavior. Recommended for constructor injection.
  </text>

  <rect x="90" y="885" rx="28" ry="28" width="1220" height="300" fill="#17351c"/>
  <text x="140" y="960" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">
    Rule: one constructor = @Autowired optional. Multiple constructors = use @Autowired to choose one.
  </text>
  <text x="140" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d9f0dc">
    Why:
  </text>
  <text x="220" y="1035" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff">
    Spring can infer the constructor automatically when there is only one.
  </text>
  <text x="140" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d9f0dc">
    Benefit:
  </text>
  <text x="240" y="1100" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff">
    Less annotation noise, same dependency-injection behavior.
  </text>
  <text x="140" y="1165" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#d9f0dc">
    Good practice:
  </text>
  <text x="315" y="1165" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff">
    Keep dependencies `final` and use constructor injection.
  </text>
</svg>
