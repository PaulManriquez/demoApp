<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="header">

  <div class="d-flex flex-column p-3 h-100 admin-sidebar">

    <!-- Brand -->
    <a th:href="@{/admin}"
       class="d-flex align-items-center justify-content-between mb-3 mb-md-0 text-decoration-none admin-sidebar-brand">
      <span class="fs-5 brand">Agenda</span>
      <button type="button"
              class="btn btn-sm btn-outline-secondary d-md-none admin-sidebar-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close">
        X
      </button>
    </a>

    <hr class="text-secondary" sec:authorize="hasRole('ADMIN')">

    <ul class="nav nav-pills flex-column mb-auto"
        th:classappend="${#authorization.expression('hasRole(''TECHNICIAN'') and !hasRole(''ADMIN'')')} ? ' mt-3 pt-2 border-top' : ''">

      <!-- Dashboard -->
      <li class="nav-item" sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/admin}"
           class="nav-link sidebar-link"
           th:classappend="${position == 'dashboard'} ? ' active bg-primary'">
          Dashboard
        </a>
      </li>

      <!-- Servicios -->
      <li sec:authorize="hasRole('ADMIN')">
        <a th:href="@{/services}"
           class="nav-link sidebar-link"
           th:classappend="${position == 'services'} ? ' active bg-primary'">
          Servicios
        </a>
      </li>

      <!-- Citas -->
      <li>
        <a th:href="@{/appointments}"
           class="nav-link sidebar-link"
           th:classappend="${position == 'appointments'} ? ' active bg-primary'">
          Citas
        </a>
      </li>

      <!-- Clientes -->
      <li>
        <a th:href="@{/clients}"
           class="nav-link sidebar-link"
           th:classappend="${position == 'clients'} ? ' active bg-primary'">
          Clientes
        </a>
      </li>

    </ul>

    <hr class="text-secondary">

    <small class="text-secondary" sec:authorize="hasRole('ADMIN')">Seguridad</small>

    <ul class="nav nav-pills flex-column mt-2" sec:authorize="hasRole('ADMIN')">

      <!-- Usuarios -->
      <li>
        <a th:href="@{/users}"
           class="nav-link sidebar-link"
           th:classappend="${position == 'users'} ? ' active bg-primary'">
          Usuarios
        </a>
      </li>

      <!-- Roles -->
      <li>
        <a th:href="@{/roles}"
           class="nav-link sidebar-link"
           th:classappend="${position == 'roles'} ? ' active bg-primary'">
          Roles
        </a>
      </li>

    </ul>

  </div>

</div>

</body>
</html>
