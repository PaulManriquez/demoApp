<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="userInfo">

  <nav class="navbar navbar-expand navbar-light admin-topbar px-3 py-2">

    <!-- Mobile sidebar toggle -->
    <button class="btn btn-outline-secondary d-md-none me-2"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#adminSidebarOffcanvas"
            aria-controls="adminSidebarOffcanvas">
      Menu
    </button>

    <!-- Right Side -->
    <div class="ms-auto d-flex align-items-center">

      <!-- User Dropdown -->
      <div class="dropdown" sec:authorize="isAuthenticated()">

        <a class="btn btn-light border d-flex align-items-center gap-2 dropdown-toggle admin-user-toggle"
           href="#"
           id="userDropdown"
           data-bs-toggle="dropdown"
           aria-expanded="false">

          <span class="admin-avatar" aria-hidden="true"></span>

          <span class="text-dark dropdown-label">
            <span sec:authentication="name"></span>
          </span>

          <!-- ADMIN Badge -->
          <span sec:authorize="hasRole('ADMIN')"
                class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle">
              ADMIN
          </span>

        </a>

        <!-- Dropdown Menu -->
        <ul class="dropdown-menu dropdown-menu-end shadow"
            aria-labelledby="userDropdown">

          <li>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="dropdown-item">
                Cerrar sesion
              </button>
            </form>
          </li>

        </ul>

      </div>

    </div>

  </nav>

</div>

</body>
</html>
