<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Muebles Porto - Citas</title>

    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">

    <style>
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            border: 1px solid rgba(0,0,0,.08);
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0,0,0,.06);
            gap: 1px;
        }

        .calendar-head {
            background: #f8fafc;
            padding: .6rem .25rem;
            text-align: center;
            font-weight: 700;
            font-size: .9rem;
            color: rgba(15, 23, 42, .8);
        }

        .calendar-day {
            min-height: 120px;
            padding: .5rem;
            background: #fff;
        }

        .calendar-day.outside-month {
            background: rgba(15, 23, 42, .02);
        }

        .calendar-day-number {
            font-size: .85rem;
            font-weight: 700;
        }

        .appt {
            font-size: .8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .appt-count {
            display: inline-block;
            font-size: .75rem;
        }

        @media (max-width: 767.98px) {
            .calendar-grid {
                border-radius: 12px;
            }
            .calendar-day {
                min-height: 78px;
                padding: .35rem;
            }
            .calendar-head {
                padding: .45rem .15rem;
                font-size: .8rem;
            }
            .appt {
                display: none;
            }
            .calendar-day .btn.btn-sm {
                padding: .1rem .35rem;
                line-height: 1.2;
            }
        }
    </style>
</head>

<body class="admin-page">

<div class="container-fluid px-0">
    <div th:insert="~{fragments/adminSidebarOffcanvas :: sidebar}"></div>
    <div class="row g-0">

        <aside class="col-md-3 col-lg-2 p-0 min-vh-100 d-none d-md-block">
            <div class="position-sticky top-0" style="height: 100vh;">
                <div th:insert="~{fragments/adminPageHeader :: header}"></div>
            </div>
        </aside>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">

            <div th:replace="~{fragments/adminPageUserInfo :: userInfo}"></div>

            <div class="container-fluid py-4">

                <div th:replace="~{fragments/alertsTemplate :: alert}"></div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <a class="btn btn-outline-secondary"
                           th:href="@{/appointments(year=${yearMonth.minusMonths(1).year},month=${yearMonth.minusMonths(1).monthValue})}">
                            ‹
                        </a>
                        <h4 class="m-0" th:text="${yearMonth.month} + ' ' + ${yearMonth.year}"></h4>
                        <a class="btn btn-outline-secondary"
                           th:href="@{/appointments(year=${yearMonth.plusMonths(1).year},month=${yearMonth.plusMonths(1).monthValue})}">
                            ›
                        </a>

                        <a class="btn btn-outline-primary"
                           th:href="@{/appointments/agenda(date=${today})}">
                            Ver agenda hoy
                        </a>
                    </div>

                    <button class="btn btn-primary" type="button" onclick="openCreateModal(null)">
                        Crear cita
                    </button>
                </div>

                <div class="calendar-grid">
                    <div class="calendar-head" th:each="dayName : ${dayNames}" th:text="${dayName}"></div>

                    <th:block th:each="week : ${weeks}">
                        <div th:each="day : ${week}" class="calendar-day"
                             th:classappend="${day.monthValue != yearMonth.monthValue} ? ' outside-month'">

                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <a class="calendar-day-number text-decoration-none"
                                   th:href="@{/appointments/agenda(date=${day})}"
                                   th:classappend="${day.equals(today)} ? ' text-primary' : ' text-dark'">
                                    <span th:text="${day.dayOfMonth}"></span>
                                </a>
                                <button class="btn btn-sm btn-outline-primary"
                                        type="button"
                                        th:attr="data-date=${day}"
                                        onclick="openCreateModal(this.getAttribute('data-date'))">
                                    +
                                </button>
                            </div>

                            <div class="appt-count">
                                <a class="badge text-bg-secondary text-decoration-none"
                                   th:href="@{/appointments/agenda(date=${day})}"
                                   th:if="${appointmentCountsByDay[day.toString()] != null and appointmentCountsByDay[day.toString()] > 0}"
                                   th:text="${appointmentCountsByDay[day.toString()]} + ' citas'"></a>
                                <span th:if="${appointmentCountsByDay[day.toString()] == null or appointmentCountsByDay[day.toString()] == 0}"
                                      class="text-muted">0 citas</span>
                            </div>

                            <div th:if="${appointmentsByDay[day] != null}">
                                <div th:each="a, iter : ${appointmentsByDay[day]}"
                                     th:if="${iter.index &lt; 2}"
                                     class="appt">
                                    <span class="badge text-bg-secondary"
                                          th:text="${#temporals.format(a.startAt,'HH:mm')}"></span>
                                    <span th:text="${a.client.firstName} + ' ' + ${a.client.lastName}"></span>
                                </div>
                                <div class="appt text-muted" th:if="${appointmentsByDay[day].size() &gt; 2}">
                                    <span th:text="'+' + (${appointmentsByDay[day].size()} - 2) + ' más'"></span>
                                </div>
                            </div>
                        </div>
                    </th:block>
                </div>

            </div>

        </main>
    </div>
</div>

<!-- ================= CREATE MODAL ================= -->
<div class="modal fade" id="createAppointmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <form th:action="@{/appointments}" method="post" th:object="${request}">

                <div class="modal-header">
                    <h5 class="modal-title">Crear cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Fecha</label>
                        <div class="col-sm-4">
                            <input id="appt_date" type="date" class="form-control" th:field="*{date}" required>
                        </div>
                        <label class="col-sm-2 col-form-label">Hora</label>
                        <div class="col-sm-3">
                            <input id="appt_time" type="time" class="form-control" th:field="*{time}" required>
                        </div>
                    </div>

                    <div class="row mb-3 g-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Duración (min)</label>
                            <input type="number" min="5" class="form-control" th:field="*{durationMinutes}" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label">Estado</label>
                            <input type="hidden" id="appt_status" th:field="*{status}">
                            <div class="dropdown w-100">
                                <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                        type="button"
                                        id="statusDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="statusDropdownLabel" class="dropdown-label">CREATED</span>
                                </button>
                                <ul class="dropdown-menu w-100" aria-labelledby="statusDropdown">
                                    <li th:each="s : ${statuses}">
                                        <button class="dropdown-item"
                                                type="button"
                                                th:attr="data-value=${s.name()}"
                                                onclick="setAppointmentStatus(this.getAttribute('data-value'))"
                                                th:text="${s.name()}"></button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Cliente</label>
                        <div class="col-sm-9">
                            <input type="hidden" id="appt_clientId" th:field="*{clientId}">
                            <div class="dropdown w-100">
                                <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                        type="button"
                                        id="clientDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="clientDropdownLabel" class="dropdown-label">Selecciona un cliente</span>
                                </button>
                                <ul class="dropdown-menu w-100" aria-labelledby="clientDropdown" style="max-height: 280px; overflow:auto;">
                                    <li th:each="c : ${clients}">
                                        <button class="dropdown-item"
                                                type="button"
                                                th:attr="data-value=${c.id},data-text=${c.firstName + ' ' + c.lastName}"
                                                onclick="setAppointmentClient(this.getAttribute('data-value'), this.getAttribute('data-text'))"
                                                th:text="${c.firstName} + ' ' + ${c.lastName}"></button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Técnico</label>
                        <div class="col-sm-9">
                            <input type="hidden" id="appt_technicianUserId" th:field="*{technicianUserId}">
                            <div class="dropdown w-100">
                                <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                        type="button"
                                        id="technicianDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="technicianDropdownLabel" class="dropdown-label">Selecciona un técnico</span>
                                </button>
                                <ul class="dropdown-menu w-100" aria-labelledby="technicianDropdown" style="max-height: 280px; overflow:auto;">
                                    <li th:each="u : ${technicians}">
                                        <button class="dropdown-item"
                                                type="button"
                                                th:attr="data-value=${u.id},data-text=${u.name + ' ' + u.lastName}"
                                                onclick="setAppointmentTechnician(this.getAttribute('data-value'), this.getAttribute('data-text'))"
                                                th:text="${u.name} + ' ' + ${u.lastName}"></button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Servicios</label>
                        <div class="col-sm-9">
                            <div id="appt_serviceIds">
                                <input th:each="sid : ${request.serviceIds}"
                                       type="hidden"
                                       name="serviceIds"
                                       th:value="${sid}"/>
                            </div>

                            <div class="dropdown w-100">
                                <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                        type="button"
                                        id="servicesDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="servicesDropdownLabel" class="dropdown-label">Selecciona servicios</span>
                                </button>
                                <div class="dropdown-menu w-100 p-2"
                                     aria-labelledby="servicesDropdown"
                                     style="max-height: 280px; overflow:auto;">

                                    <div class="form-check px-2 py-1" th:each="s : ${services}">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:id="${'svc_' + s.id}"
                                               th:attr="data-id=${s.id},data-text=${s.name + ' (' + s.category + ')'}"
                                               onchange="toggleService(this.getAttribute('data-id'), this.getAttribute('data-text'), this.checked)">
                                        <label class="form-check-label w-100"
                                               th:for="${'svc_' + s.id}"
                                               th:text="${s.name} + ' (' + ${s.category} + ')'"></label>
                                    </div>

                                </div>
                            </div>

                            <div class="form-text">Puedes seleccionar múltiples servicios (combo).</div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label">Notas</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
    function setAppointmentStatus(value) {
        const input = document.getElementById('appt_status');
        input.value = value;
        const label = document.getElementById('statusDropdownLabel');
        if (label) {
            label.textContent = value;
        }
    }

    function setAppointmentClient(value, text) {
        const input = document.getElementById('appt_clientId');
        input.value = value;
        const label = document.getElementById('clientDropdownLabel');
        if (label) {
            label.textContent = text;
        }
    }

    function setAppointmentTechnician(value, text) {
        const input = document.getElementById('appt_technicianUserId');
        input.value = value;
        const label = document.getElementById('technicianDropdownLabel');
        if (label) {
            label.textContent = text;
        }
    }

    function toggleService(id, text, checked) {
        const container = document.getElementById('appt_serviceIds');
        if (!container) return;

        if (checked) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'serviceIds';
            input.value = id;
            input.setAttribute('data-service-id', id);
            input.setAttribute('data-service-text', text);
            container.appendChild(input);
        } else {
            const existing = container.querySelector('input[data-service-id="' + id + '"]');
            if (existing) existing.remove();
        }

        updateServicesLabelFromHidden();
    }

    function updateServicesLabelFromHidden() {
        const container = document.getElementById('appt_serviceIds');
        const label = document.getElementById('servicesDropdownLabel');
        if (!container || !label) return;

        const inputs = Array.from(container.querySelectorAll('input[name="serviceIds"]'));
        if (inputs.length === 0) {
            label.textContent = 'Selecciona servicios';
            return;
        }

        if (inputs.length <= 2) {
            const names = inputs.map(i => i.getAttribute('data-service-text') || ('ID ' + i.value));
            label.textContent = names.join(', ');
            return;
        }

        label.textContent = inputs.length + ' servicios seleccionados';
    }

    function openCreateModal(dateValue) {
        if (dateValue) {
            document.getElementById('appt_date').value = dateValue;
        }
        const currentStatus = document.getElementById('appt_status').value || 'CREATED';
        setAppointmentStatus(currentStatus);

        // If values were already selected (validation errors), keep the labels readable.
        const clientId = document.getElementById('appt_clientId').value;
        if (clientId) {
            const clientBtn = document.querySelector('#clientDropdown [data-value="' + clientId + '"]');
            if (clientBtn) {
                setAppointmentClient(clientId, clientBtn.getAttribute('data-text'));
            }
        }

        const techId = document.getElementById('appt_technicianUserId').value;
        if (techId) {
            const techBtn = document.querySelector('#technicianDropdown [data-value="' + techId + '"]');
            if (techBtn) {
                setAppointmentTechnician(techId, techBtn.getAttribute('data-text'));
            }
        }

        // Restore service checkboxes + label from hidden inputs
        const serviceIds = Array.from(document.querySelectorAll('#appt_serviceIds input[name="serviceIds"]'))
            .map(i => i.value);
        const checkboxes = document.querySelectorAll('#servicesDropdown [data-id]');
        for (const checkbox of checkboxes) {
            checkbox.checked = serviceIds.includes(checkbox.getAttribute('data-id'));
        }
        // Populate missing text attributes for persisted hidden values (if any)
        for (const checkbox of checkboxes) {
            const id = checkbox.getAttribute('data-id');
            const hidden = document.querySelector('#appt_serviceIds input[data-service-id="' + id + '"]');
            if (hidden && !hidden.getAttribute('data-service-text')) {
                hidden.setAttribute('data-service-text', checkbox.getAttribute('data-text'));
            }
        }
        updateServicesLabelFromHidden();

        const modal = new bootstrap.Modal(document.getElementById('createAppointmentModal'));
        modal.show();
    }
</script>

</body>
</html>
