<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Muebles Porto - Administración</title>

  <!-- Bootstrap 5 -->
  <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">

  <!-- FontAwesome -->
  <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">

  <!-- Admin template -->
  <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

  <!-- Datatables -->
  <link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">

</head>

<body id="page-top">

<div id="wrapper">

  <header th:replace="~{fragments/adminPageHeader :: header}"></header>

  <div id="content-wrapper" class="d-flex flex-column">

    <div id="content">

      <div th:replace="~{fragments/adminPageUserInfo :: userInfo}"></div>

      <div class="container-fluid">

        <div th:replace="~{fragments/alertsTemplate :: alert}"></div>

        <!-- ================= NEW PRODUCT ================= -->

        <div class="row mb-4">

          <button class="btn btn-primary"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#newProductForm">
            Nuevo Producto
          </button>

          <div class="collapse mt-3" id="newProductForm">
            <div class="card card-body">

              <form th:action="@{/products/}" method="post" th:object="${product}">

                <div class="mb-3">
                  <label>Nombre:</label>
                  <input type="text" class="form-control" name="name" required>
                </div>

                <div class="mb-3">
                  <label>Piezas:</label>
                  <input type="number" class="form-control" name="items" required>
                </div>

                <div class="mb-3">
                  <label>Precio Menudeo:</label>
                  <input type="text" class="form-control" name="retailPrice" required>
                </div>

                <div class="mb-3">
                  <label>Precio Mayoreo:</label>
                  <input type="text" class="form-control" name="wholesalePrice" required>
                </div>

                <div class="form-check mb-3">
                  <input type="checkbox" class="form-check-input" name="special">
                  <label class="form-check-label">Producto Especial</label>
                </div>

                <div class="mb-3">
                  <label>Descripción:</label>
                  <textarea class="form-control" name="description"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>

              </form>

            </div>
          </div>

        </div>

        <!-- ================= TABLE ================= -->

        <table class="table table-bordered">

          <thead>
          <tr>
            <th>Nombre</th>
            <th>Piezas</th>
            <th>Precio mayoreo</th>
            <th>Precio menudeo</th>
            <th>Acciones</th>
          </tr>
          </thead>

          <tbody>

          <tr th:each="product : ${products}">

            <td th:text="${product.name}"></td>
            <td th:text="${product.items}"></td>
            <td th:text="${product.wholesalePrice}"></td>
            <td th:text="${product.retailPrice}"></td>

            <td>

              <!-- EDIT -->
              <button class="btn btn-primary btn-sm"
                      th:data-id="${product.id}"
                      th:data-name="${product.name}"
                      th:data-items="${product.items}"
                      th:data-wholesalePrice="${product.wholesalePrice}"
                      th:data-retailPrice="${product.retailPrice}"
                      th:data-special="${product.special}"
                      th:data-description="${product.description}"
                      onclick="showProductModal(
                                        this.getAttribute('data-name'),
                                        this.getAttribute('data-items'),
                                        this.getAttribute('data-wholesalePrice'),
                                        this.getAttribute('data-retailPrice'),
                                        this.getAttribute('data-special'),
                                        this.getAttribute('data-description'),
                                        this.getAttribute('data-id'))">

                <i class="fas fa-edit"></i> Edit
              </button>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>

<!-- ================= MODAL ================= -->

<div class="modal fade" id="editProductModal" tabindex="-1">

  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form th:action="@{/products/update-product}" method="post">

          <input type="hidden" name="_method" value="put">

          <input type="hidden" id="productIdModal" name="id">

          <div class="mb-3">
            <label>Nombre</label>
            <input type="text" id="productModalName" name="name" class="form-control">
          </div>

          <div class="mb-3">
            <label>Piezas</label>
            <input type="text" id="productModalItems" name="items" class="form-control">
          </div>

          <div class="mb-3">
            <label>Precio Mayoreo</label>
            <input type="text" id="productModalWholesalePrice" name="wholesalePrice" class="form-control">
          </div>

          <div class="mb-3">
            <label>Precio Menudeo</label>
            <input type="text" id="productModalRetailPrice" name="retailPrice" class="form-control">
          </div>

          <div class="mb-3">
            <label>Descripción</label>
            <input type="text" id="productModalDescription" name="description" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary">Actualizar</button>

        </form>

      </div>

    </div>
  </div>

</div>

<!-- ================= SCRIPTS ================= -->

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

<script>
function showProductModal(name, items, wholesalePrice, retailPrice, special, description, id) {

    document.getElementById('productModalName').value = name;
    document.getElementById('productModalItems').value = items;
    document.getElementById('productModalWholesalePrice').value = wholesalePrice;
    document.getElementById('productModalRetailPrice').value = retailPrice;
    document.getElementById('productModalDescription').value = description;
    document.getElementById('productIdModal').value = id;

    const modal = new bootstrap.Modal(document.getElementById('editProductModal'));
    modal.show();
}
</script>

</body>
</html>
