<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Muebles Porto - Productos de Compra</title>

    <!-- Bootstrap 5 -->
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">

    <!-- FontAwesome -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">

    <!-- Admin template -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

</head>

<body id="page-top">

<div id="wrapper">

    <!-- HEADER -->
    <header th:replace="~{fragments/adminPageHeader :: header}"></header>

    <div id="content-wrapper" class="d-flex flex-column">

        <div id="content">

            <!-- USER INFO -->
            <div th:replace="~{fragments/adminPageUserInfo :: userInfo}"></div>

            <div class="container-fluid">

                <!-- ALERTS -->
                <div th:replace="~{fragments/alertsTemplate :: alert}"></div>

                <!-- ================= PURCHASE INFO ================= -->

                <div class="card shadow mb-4">
                    <div class="card-header">
                        <h6 class="m-0 font-weight-bold text-primary">
                            Compra #<span th:text="${purchase.id}"></span>
                        </h6>
                    </div>
                    <div class="card-body">
                        <p><strong>Proveedor:</strong> <span th:text="${purchase.provider.name}"></span></p>
                        <p><strong>Fecha:</strong> <span th:text="${purchase.date}"></span></p>
                    </div>
                </div>

                <!-- ================= ADD PRODUCT ================= -->

                <div class="row mb-4">

                    <button class="btn btn-success"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#addProductForm">
                        Agregar Producto
                    </button>

                    <div class="collapse mt-3" id="addProductForm">
                        <div class="card card-body">

                            <!-- Form  builds a Stock entity -->
                            <form th:action="@{/purchases/products/add}" method="post">

                                <!-- purchase id ( to relate it to the product that you select)-->
                                <input type="hidden" name="purchase.id" th:value="${purchase.id}">

                                <div class="mb-3">
                                    <label>Producto:</label>
                                    <select class="form-control" name="product.id" required>
                                        <option th:each="product : ${products}"
                                                th:value="${product.id}"
                                                th:text="${product.name}">
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label>Numero de unidades:</label>
                                    <input type="number" step="1" min="1" class="form-control" name="quantity" required>
                                </div>

                                <div class="mb-3">
                                    <label>Precio de compra:</label>
                                    <input type="number" step="0.01" class="form-control" name="purchasePrice" required>
                                </div>

                                <div class="mb-3">
                                    <label>Descripción:</label>
                                    <input type="text" class="form-control" name="description">
                                </div>

                                <div class="mb-3">
                                    <label>Precio de venta:</label>
                                    <input type="number" step="0.01" class="form-control" name="salePrice" required>
                                </div>

                                <button type="submit" class="btn btn-primary">Agregar</button>

                            </form>

                        </div>
                    </div>

                </div>

                <!-- ================= STOCK TABLE ================= -->

                <div class="card shadow mb-4">

                    <div class="card-header">
                        <h6 class="m-0 font-weight-bold text-primary">
                            Productos en la compra
                        </h6>
                    </div>

                    <div class="card-body">

                        <table class="table table-bordered">

                            <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Descripción</th>
                                <th>Precio compra</th>
                                <th>Precio de venta</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="item : ${stockItems}">

                                <td th:text="${item.product.name}"></td>
                                <td th:text="${item.description}"></td>
                                <td th:text="${item.purchasePrice}"></td>
                                <td th:text="${item.salePrice}"></td>
                            </tr>

                            <tr> </tr>

                            <tr>
                                <th>Total $:</th>
                                <td colspan="3"
                                    th:text="${totalPurchase}">
                                </td>
                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ================= SCRIPTS ================= -->

<!-- CONFIRMATION MODAL -->
<div th:replace="~{fragments/confirmationModal :: confirmationModal}"></div>

<!-- ================= SCRIPTS ================= -->

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!-- JS -->
<script th:src="@{/js/branches/branch.js}"></script>

<!-- OPTIONAL -->
<script th:src="@{/js/sb-admin-2.min.js}"></script>

</body>
</html>
