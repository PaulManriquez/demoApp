<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Muebles Porto - Administración</title>

  <!-- Bootstrap 5 -->
  <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">

  <!-- FontAwesome -->
  <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet">

  <!-- Admin template -->
  <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

  <!-- Datatables -->
  <link th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}" rel="stylesheet">

</head>

<body id="page-top">

<div id="wrapper">

  <!-- HEADER -->
  <header th:replace="~{fragments/adminPageHeader :: header}"></header>

  <div id="content-wrapper" class="d-flex flex-column">

    <div id="content">

      <!-- USER INFO -->
      <div th:replace="~{fragments/adminPageUserInfo :: userInfo}"></div>

      <div class="container-fluid">

        <!-- ALERTS -->
        <div th:replace="~{fragments/alertsTemplate :: alert}"></div>

        <!-- ================= NEW PURCHASE ================= -->

        <div class="row mb-4">

          <button class="btn btn-primary"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#newPurchaseForm">
            Nueva Compra
          </button>

          <div class="collapse mt-3" id="newPurchaseForm">
            <div class="card card-body">

              <form th:action="@{/purchases/}" method="post" th:object="${purchase}">

                <div class="mb-3">
                  <label>Fecha compra:</label>
                  <input type="date" class="form-control" name="date" required>
                </div>

                <div class="mb-3">
                  <label>Proveedor:</label>
                  <select class="form-control" name="provider" required>
                    <option th:each="provider : ${providers}"
                            th:value="${provider.id}"
                            th:text="${provider.name}">
                    </option>
                  </select>
                </div>

                <input type="hidden" name="user" th:value="${session.userId}"/>

                <button type="submit" class="btn btn-primary">Guardar</button>

              </form>

            </div>
          </div>

        </div>

        <!-- ================= TABLE ================= -->

        <div class="card shadow mb-4">

          <div class="card-header">
            <h6 class="m-0 font-weight-bold text-primary">Historial de compras</h6>
          </div>

          <div class="card-body">

            <table class="table table-bordered">

              <thead>
              <tr>
                <th>Fecha compra</th>
                <th>Proveedor</th>
                <th>Acciones</th>
              </tr>
              </thead>

              <tbody>

              <tr th:each="purchase : ${purchases}">

                <td th:text="${purchase.date}"></td>
                <td th:text="${purchase.provider.name}"></td>

                <td>

                  <!-- EDIT -->
                  <button sec:authorize="hasAuthority('UPDATE_PURCHASE') or hasAuthority('ROLE_ADMIN')"
                          class="btn btn-primary btn-sm"
                          th:data-id="${purchase.id}"
                          th:data-date="${purchase.date}"
                          th:data-providerid="${purchase.provider.id}"
                          th:data-userid="${purchase.user.id}"
                          onclick="showPurchaseModal(
                                                      this.dataset.date,
                                                      this.dataset.id,
                                                      this.dataset.providerid,
                                                      this.dataset.userid
                                                )">

                    <i class="fas fa-edit"></i> Edit
                  </button>

                  <!-- PRODUCTS -->
                  <a sec:authorize="hasAuthority('UPDATE_PURCHASE') or hasAuthority('ROLE_ADMIN')"
                     class="btn btn-success btn-sm"
                     th:href="@{/purchases/products/{id}(id=${purchase.id})}">

                    <i class="fas fa-plus-square"></i> Productos
                  </a>

                </td>

              </tr>

              </tbody>

            </table>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- ================= MODAL ================= -->

<div class="modal fade" id="editPurchaseModal" tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Compra</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form th:action="@{/purchases/update}"
              th:object="${purchase}"
              method="post">

          <!-- Hidden put method -->
          <input type="hidden" name="_method" value="put">

          <!-- IDs -->
          <input type="hidden" id="purchaseModalId" th:field="*{id}">
          <input type="hidden" id="purchaseModalUserId" th:field="*{user.id}">

          <div class="mb-3">
            <label>Fecha</label>
            <input type="date" id="purchaseModalDate" th:field="*{date}" class="form-control">
          </div>

          <div class="mb-3">
            <label>Proveedor</label>
            <select id="purchaseModalProvider" th:field="*{provider.id}" class="form-control">
              <option value="">Seleccione un proveedor</option>
              <option th:each="provider : ${providers}"
                      th:value="${provider.id}"
                      th:text="${provider.name}">
              </option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Guardar</button>

        </form>

      </div>

    </div>

  </div>

</div>

<!-- CONFIRMATION MODAL -->
<div th:replace="~{fragments/confirmationModal :: confirmationModal}"></div>

<!-- ================= SCRIPTS ================= -->

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!-- JS -->
<script th:src="@{/js/branches/branch.js}"></script>

<!-- OPTIONAL -->
<script th:src="@{/js/sb-admin-2.min.js}"></script>

</body>
</html>
