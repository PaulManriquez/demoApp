<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Muebles Porto - Usuarios</title>

    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>

<body class="admin-page">

<div class="container-fluid px-0">
    <div th:insert="~{fragments/adminSidebarOffcanvas :: sidebar}"></div>
    <div class="row g-0">

        <aside class="col-md-3 col-lg-2 p-0 min-vh-100 d-none d-md-block">
            <div class="position-sticky top-0" style="height: 100vh;">
                <div th:insert="~{fragments/adminPageHeader :: header}"></div>
            </div>
        </aside>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">

            <div th:replace="~{fragments/adminPageUserInfo :: userInfo}"></div>

            <div class="container-fluid py-4">

                <div th:replace="~{fragments/alertsTemplate :: alert}"></div>

                <div class="row mb-4">
                    <button class="btn btn-primary"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#newUserForm">
                        Nuevo Usuario
                    </button>

                    <div class="collapse mt-3" id="newUserForm">
                        <div class="card card-body">
                            <form th:action="@{/users}" method="post" th:object="${userForm}">

                                <div class="row mb-3">
                                    <label class="col-sm-2 col-form-label">Nombre</label>
                                    <div class="col-sm-4">
                                        <input class="form-control" type="text" th:field="*{name}" required>
                                    </div>
                                    <label class="col-sm-2 col-form-label">Apellido</label>
                                    <div class="col-sm-4">
                                        <input class="form-control" type="text" th:field="*{lastName}" required>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label class="col-sm-2 col-form-label">Username</label>
                                    <div class="col-sm-4">
                                        <input class="form-control" type="text" th:field="*{username}" required>
                                    </div>
                                    <label class="col-sm-2 col-form-label">Email</label>
                                    <div class="col-sm-4">
                                        <input class="form-control" type="email" th:field="*{email}" required>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label class="col-sm-2 col-form-label">Teléfono</label>
                                    <div class="col-sm-4">
                                        <input class="form-control" type="text" th:field="*{phone}">
                                    </div>
                                    <label class="col-sm-2 col-form-label">Contraseña</label>
                                    <div class="col-sm-4">
                                        <input class="form-control" type="password" th:field="*{password}" required>
                                    </div>
                                </div>

                                <div class="row mb-3">
                                    <label class="col-sm-2 col-form-label">Status</label>
                                    <div class="col-sm-4">
                                        <input type="hidden" id="create_status" th:field="*{status}">
                                        <div class="dropdown w-100">
                                            <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                                    type="button"
                                                    id="createUserStatusDropdown"
                                                    data-bs-toggle="dropdown"
                                                    aria-expanded="false">
                                                <span id="createUserStatusDropdownLabel" class="dropdown-label">Activo</span>
                                            </button>
                                            <ul class="dropdown-menu w-100" aria-labelledby="createUserStatusDropdown">
                                                <li>
                                                    <button class="dropdown-item" type="button"
                                                            onclick="setCreateUserStatus(true)">
                                                        Activo
                                                    </button>
                                                </li>
                                                <li>
                                                    <button class="dropdown-item" type="button"
                                                            onclick="setCreateUserStatus(false)">
                                                        Inactivo
                                                    </button>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                    <label class="col-sm-2 col-form-label">Roles</label>
                                    <div class="col-sm-4">
                                        <div id="create_userRoleIds">
                                            <input th:each="rid : ${userForm.roleIds}"
                                                   type="hidden"
                                                   name="roleIds"
                                                   th:value="${rid}"/>
                                        </div>

                                        <div class="dropdown w-100">
                                            <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                                    type="button"
                                                    id="createUserRolesDropdown"
                                                    data-bs-toggle="dropdown"
                                                    aria-expanded="false">
                                                <span id="createUserRolesDropdownLabel" class="dropdown-label">Selecciona roles</span>
                                            </button>
                                            <div class="dropdown-menu w-100 p-2"
                                                 aria-labelledby="createUserRolesDropdown"
                                                 style="max-height: 280px; overflow:auto;">

                                                <div class="form-check px-2 py-1" th:each="r : ${roles}">
                                                    <input class="form-check-input"
                                                           type="checkbox"
                                                           th:id="${'create_user_role_' + r.id}"
                                                           th:attr="data-id=${r.id},data-text=${r.name}"
                                                           onchange="toggleCreateUserRole(this.getAttribute('data-id'), this.getAttribute('data-text'), this.checked)">
                                                    <label class="form-check-label w-100"
                                                           th:for="${'create_user_role_' + r.id}"
                                                           th:text="${r.name}"></label>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="col-sm-12">
                                    <button type="submit" class="btn btn-primary" style="float:right">
                                        Guardar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Mobile cards -->
                <div class="d-md-none mobile-cards">
                    <div class="mb-3" th:each="u : ${users}">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <div class="card-title mb-1" th:text="${u.name} + ' ' + ${u.lastName}"></div>
                                        <div class="meta">
                                            <div th:text="${u.username}"></div>
                                            <div th:text="${u.email}"></div>
                                        </div>
                                    </div>
                                    <div>
                                        <span th:if="${u.status}" class="badge text-bg-success">Activo</span>
                                        <span th:if="${!u.status}" class="badge text-bg-secondary">Inactivo</span>
                                    </div>
                                </div>

                                <div class="mt-2">
                                    <span th:each="r : ${u.roles}" class="badge bg-dark me-1" th:text="${r.name}"></span>
                                </div>

                                <div class="actions mt-3">
                                    <button class="btn btn-light btn-sm w-100"
                                            th:data-id="${u.id}"
                                            th:data-name="${u.name}"
                                            th:data-lastName="${u.lastName}"
                                            th:data-username="${u.username}"
                                            th:data-email="${u.email}"
                                            th:data-phone="${u.phone}"
                                            th:data-status="${u.status}"
                                            th:data-roleIds="${#strings.listJoin(u.roles.![id], ',')}"
                                            onclick="showEditUserModal(this)">
                                        Editar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Desktop table -->
                <div class="card shadow mb-4 d-none d-md-block">
                    <div class="card-header py-3">
                        <h6 class="m-0 font-weight-bold text-primary">Usuarios</h6>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm table-hover align-middle admin-table">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                    <th>Roles</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="u : ${users}">
                                    <td th:text="${u.id}"></td>
                                    <td th:text="${u.name} + ' ' + ${u.lastName}"></td>
                                    <td th:text="${u.username}"></td>
                                    <td th:text="${u.email}"></td>
                                    <td>
                                        <span th:if="${u.status}" class="badge bg-success">Activo</span>
                                        <span th:if="${!u.status}" class="badge bg-secondary">Inactivo</span>
                                    </td>
                                    <td>
                                        <span th:each="r : ${u.roles}" class="badge bg-dark me-1" th:text="${r.name}"></span>
                                    </td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2 flex-wrap">
                                            <button class="btn btn-primary btn-sm"
                                                    th:data-id="${u.id}"
                                                    th:data-name="${u.name}"
                                                    th:data-lastName="${u.lastName}"
                                                    th:data-username="${u.username}"
                                                    th:data-email="${u.email}"
                                                    th:data-phone="${u.phone}"
                                                    th:data-status="${u.status}"
                                                    th:data-roleIds="${#strings.listJoin(u.roles.![id], ',')}"
                                                    onclick="showEditUserModal(this)">
                                                Editar
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${users == null or users.isEmpty()}">
                                    <td colspan="7" class="text-muted text-center py-4">No hay usuarios.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="form-text">En edición, la contraseña es opcional (si la dejas vacía no cambia).</div>
                    </div>
                </div>

            </div>

        </main>
    </div>
</div>

<!-- ================= EDIT MODAL ================= -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <form th:action="@{/users/update}" method="post">
                <input type="hidden" name="_method" value="put"/>

                <input type="hidden" id="edit_id" name="id"/>

                <div class="modal-header">
                    <h5 class="modal-title">Editar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">

                    <div class="row mb-3">
                        <label class="col-sm-2 col-form-label">Nombre</label>
                        <div class="col-sm-4">
                            <input id="edit_name" class="form-control" type="text" name="name" required>
                        </div>
                        <label class="col-sm-2 col-form-label">Apellido</label>
                        <div class="col-sm-4">
                            <input id="edit_lastName" class="form-control" type="text" name="lastName" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-2 col-form-label">Username</label>
                        <div class="col-sm-4">
                            <input id="edit_username" class="form-control" type="text" name="username" required>
                        </div>
                        <label class="col-sm-2 col-form-label">Email</label>
                        <div class="col-sm-4">
                            <input id="edit_email" class="form-control" type="email" name="email" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-2 col-form-label">Teléfono</label>
                        <div class="col-sm-4">
                            <input id="edit_phone" class="form-control" type="text" name="phone">
                        </div>
                        <label class="col-sm-2 col-form-label">Contraseña</label>
                        <div class="col-sm-4">
                            <input class="form-control" type="password" name="password" placeholder="(opcional)">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label class="col-sm-2 col-form-label">Status</label>
                        <div class="col-sm-4">
                            <input type="hidden" id="edit_status" name="status" value="true">
                            <div class="dropdown w-100">
                                <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                        type="button"
                                        id="userStatusDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="userStatusDropdownLabel" class="dropdown-label">Activo</span>
                                </button>
                                <ul class="dropdown-menu w-100" aria-labelledby="userStatusDropdown">
                                    <li>
                                        <button class="dropdown-item" type="button"
                                                onclick="setUserStatus(true)">
                                            Activo
                                        </button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" type="button"
                                                onclick="setUserStatus(false)">
                                            Inactivo
                                        </button>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <label class="col-sm-2 col-form-label">Roles</label>
                        <div class="col-sm-4">
                            <div id="edit_userRoleIds"></div>

                            <div class="dropdown w-100">
                                <button class="btn btn-outline-primary dropdown-toggle w-100 text-start"
                                        type="button"
                                        id="userRolesDropdown"
                                        data-bs-toggle="dropdown"
                                        aria-expanded="false">
                                    <span id="userRolesDropdownLabel" class="dropdown-label">Selecciona roles</span>
                                </button>
                                <div class="dropdown-menu w-100 p-2"
                                     aria-labelledby="userRolesDropdown"
                                     style="max-height: 280px; overflow:auto;">

                                    <div class="form-check px-2 py-1" th:each="r : ${roles}">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:id="${'user_role_' + r.id}"
                                               th:attr="data-id=${r.id},data-text=${r.name}"
                                               onchange="toggleUserRole(this.getAttribute('data-id'), this.getAttribute('data-text'), this.checked)">
                                        <label class="form-check-label w-100"
                                               th:for="${'user_role_' + r.id}"
                                               th:text="${r.name}"></label>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script>
    function setCreateUserStatus(active) {
        const input = document.getElementById('create_status');
        input.value = active ? 'true' : 'false';
        const label = document.getElementById('createUserStatusDropdownLabel');
        if (label) {
            label.textContent = active ? 'Activo' : 'Inactivo';
        }
    }

    function toggleCreateUserRole(id, text, checked) {
        const container = document.getElementById('create_userRoleIds');
        if (!container) return;

        if (checked) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'roleIds';
            input.value = id;
            input.setAttribute('data-role-id', id);
            input.setAttribute('data-role-text', text);
            container.appendChild(input);
        } else {
            const existing = container.querySelector('input[data-role-id="' + id + '"]');
            if (existing) existing.remove();
        }

        updateCreateUserRolesLabelFromHidden();
    }

    function updateCreateUserRolesLabelFromHidden() {
        const container = document.getElementById('create_userRoleIds');
        const label = document.getElementById('createUserRolesDropdownLabel');
        if (!container || !label) return;

        const inputs = Array.from(container.querySelectorAll('input[name="roleIds"]'));
        if (inputs.length === 0) {
            label.textContent = 'Selecciona roles';
            return;
        }

        if (inputs.length <= 2) {
            const names = inputs.map(i => i.getAttribute('data-role-text') || ('ID ' + i.value));
            label.textContent = names.join(', ');
            return;
        }

        label.textContent = inputs.length + ' roles seleccionados';
    }

    function setUserStatus(active) {
        const input = document.getElementById('edit_status');
        input.value = active ? 'true' : 'false';
        const label = document.getElementById('userStatusDropdownLabel');
        if (label) {
            label.textContent = active ? 'Activo' : 'Inactivo';
        }
    }

    function toggleUserRole(id, text, checked) {
        const container = document.getElementById('edit_userRoleIds');
        if (!container) return;

        if (checked) {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'roleIds';
            input.value = id;
            input.setAttribute('data-role-id', id);
            input.setAttribute('data-role-text', text);
            container.appendChild(input);
        } else {
            const existing = container.querySelector('input[data-role-id="' + id + '"]');
            if (existing) existing.remove();
        }

        updateUserRolesLabelFromHidden();
    }

    function updateUserRolesLabelFromHidden() {
        const container = document.getElementById('edit_userRoleIds');
        const label = document.getElementById('userRolesDropdownLabel');
        if (!container || !label) return;

        const inputs = Array.from(container.querySelectorAll('input[name="roleIds"]'));
        if (inputs.length === 0) {
            label.textContent = 'Selecciona roles';
            return;
        }

        if (inputs.length <= 2) {
            const names = inputs.map(i => i.getAttribute('data-role-text') || ('ID ' + i.value));
            label.textContent = names.join(', ');
            return;
        }

        label.textContent = inputs.length + ' roles seleccionados';
    }

    function showEditUserModal(button) {
        document.getElementById('edit_id').value = button.getAttribute('data-id');
        document.getElementById('edit_name').value = button.getAttribute('data-name');
        document.getElementById('edit_lastName').value = button.getAttribute('data-lastName');
        document.getElementById('edit_username').value = button.getAttribute('data-username');
        document.getElementById('edit_email').value = button.getAttribute('data-email');
        document.getElementById('edit_phone').value = button.getAttribute('data-phone') || '';
        setUserStatus(button.getAttribute('data-status') === 'true');

        // Roles
        const container = document.getElementById('edit_userRoleIds');
        container.innerHTML = '';
        const roleIdsCsv = button.getAttribute('data-roleIds') || '';
        const roleIds = roleIdsCsv.split(',').filter(Boolean);

        const checkboxes = document.querySelectorAll('#userRolesDropdown [data-id]');
        for (const checkbox of checkboxes) {
            const id = checkbox.getAttribute('data-id');
            const isSelected = roleIds.includes(id);
            checkbox.checked = isSelected;
            if (isSelected) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'roleIds';
                input.value = id;
                input.setAttribute('data-role-id', id);
                input.setAttribute('data-role-text', checkbox.getAttribute('data-text'));
                container.appendChild(input);
            }
        }
        updateUserRolesLabelFromHidden();

        const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
        modal.show();
    }

    // Initialize create form status label from bound value (if any)
    (function initCreateUserStatusLabel() {
        const input = document.getElementById('create_status');
        if (!input) return;
        const isActive = input.value === '' || input.value === 'true';
        setCreateUserStatus(isActive);
    })();

    (function initCreateUserRoles() {
        const container = document.getElementById('create_userRoleIds');
        if (!container) return;

        const roleIds = Array.from(container.querySelectorAll('input[name="roleIds"]')).map(i => i.value);
        const checkboxes = document.querySelectorAll('#createUserRolesDropdown [data-id]');
        for (const checkbox of checkboxes) {
            const id = checkbox.getAttribute('data-id');
            checkbox.checked = roleIds.includes(id);
            if (checkbox.checked) {
                const hidden = container.querySelector('input[data-role-id="' + id + '"]');
                if (hidden && !hidden.getAttribute('data-role-text')) {
                    hidden.setAttribute('data-role-text', checkbox.getAttribute('data-text'));
                }
            }
        }
        updateCreateUserRolesLabelFromHidden();
    })();
</script>

</body>
</html>
