<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Muebles Porto - Administración</title>

    <!-- Bootstrap 5 -->
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">

</head>

<body class="admin-page">

<div class="container-fluid px-0">
    <div th:insert="~{fragments/adminSidebarOffcanvas :: sidebar}"></div>
    <div class="row g-0">

        <!-- Sidebar Fragment -->
        <aside class="col-md-3 col-lg-2 p-0 min-vh-100 d-none d-md-block">
            <div class="position-sticky top-0" style="height: 100vh;">
                <div th:insert="~{fragments/adminPageHeader :: header}"></div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">

            <!-- Topbar Fragment -->
            <div th:insert="~{fragments/adminPageUserInfo :: userInfo}"></div>

            <!-- Page Content -->
            <div class="container-fluid py-4">
                <h1 class="h4 mb-2">Dashboard</h1>
                <p class="text-muted mb-0">Servicios, citas, clientes, usuarios y roles.</p>
            </div>

        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
