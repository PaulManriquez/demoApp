<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Muebles Porto - Administración</title>

    <!-- Bootstrap 5 -->
    <link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">

</head>

<body class="admin-page">

<div class="container-fluid px-0">
    <div th:insert="~{fragments/adminSidebarOffcanvas :: sidebar}"></div>
    <div class="row g-0">

        <!-- Sidebar Fragment -->
        <aside class="col-md-3 col-lg-2 p-0 min-vh-100 d-none d-md-block">
            <div class="position-sticky top-0" style="height: 100vh;">
                <div th:insert="~{fragments/adminPageHeader :: header}"></div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-3">

            <!-- Topbar Fragment -->
            <div th:insert="~{fragments/adminPageUserInfo :: userInfo}"></div>

            <!-- Page Content -->
            <div class="container-fluid py-4">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <div>
                        <h1 class="h4 mb-1">Resumen de hoy</h1>
                        <div class="text-muted" th:text="${#temporals.format(today,'yyyy-MM-dd')}"></div>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-primary" th:href="@{/appointments}">Calendario</a>
                        <a class="btn btn-primary" th:href="@{/appointments/agenda(date=${today})}">Agenda de hoy</a>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6 col-lg-2">
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <div class="text-muted small">Total</div>
                                <div class="h4 mb-0" th:text="${todayCounts['TOTAL']}">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-lg-7">
                        <div class="card shadow-sm h-100">
                            <div class="card-header py-3">
                                <div class="fw-semibold">Próximas citas (próximos <span th:text="${upcomingDays}">3</span> días)</div>
                            </div>
                            <div class="card-body">
                                <div th:if="${upcomingAppointments == null or upcomingAppointments.isEmpty()}" class="text-muted">
                                    No hay próximas citas en este rango.
                                </div>
                                <div class="list-group" th:if="${upcomingAppointments != null and !upcomingAppointments.isEmpty()}">
                                    <div class="list-group-item"
                                         th:each="a, iter : ${upcomingAppointments}"
                                         th:if="${iter.index < 8}">
                                        <div class="d-flex justify-content-between align-items-start gap-2">
                                            <div class="flex-grow-1">
                                                <div class="fw-semibold"
                                                     th:text="${a.client.firstName} + ' ' + ${a.client.lastName}"></div>
                                                <div class="text-muted small">
                                                    <span th:text="${#temporals.format(a.startAt,'EEE dd MMM HH:mm')}"></span>
                                                    <span> • </span>
                                                    <span th:text="${a.technician.name} + ' ' + ${a.technician.lastName}"></span>
                                                </div>
                                                <div class="text-muted small mt-1" th:if="${a.services != null and !a.services.isEmpty()}">
                                                    <span th:each="aps, iter : ${a.services}">
                                                        <span th:if="${aps.service != null}" th:text="${aps.service.name}"></span><span th:if="${aps.service != null and !iter.last}">, </span>
                                                    </span>
                                                </div>
                                            </div>

                                            <div class="d-flex flex-column align-items-end gap-2">
                                                <span th:class="${'badge ' + (
                                                        a.status == T(com.demoApp.demoApp.entity.AppointmentStatus).CREATED ? 'text-bg-primary' :
                                                        a.status == T(com.demoApp.demoApp.entity.AppointmentStatus).CONFIRMED ? 'bg-success-subtle text-success-emphasis border border-success-subtle' :
                                                        a.status == T(com.demoApp.demoApp.entity.AppointmentStatus).CANCELED ? 'text-bg-danger' :
                                                        a.status == T(com.demoApp.demoApp.entity.AppointmentStatus).COMPLETED ? 'text-bg-success' :
                                                        a.status == T(com.demoApp.demoApp.entity.AppointmentStatus).NO_SHOW ? 'text-bg-warning' :
                                                        'text-bg-secondary'
                                                )}"
                                                      th:text="${a.status}"></span>

                                                <div class="dropdown">
                                                    <button class="btn btn-outline-primary btn-sm dropdown-toggle"
                                                            type="button"
                                                            th:id="${'apptStatusDropdown_' + a.id}"
                                                            data-bs-toggle="dropdown"
                                                            aria-expanded="false">
                                                        Cambiar
                                                    </button>
                                                    <ul class="dropdown-menu dropdown-menu-end"
                                                        th:attr="aria-labelledby=${'apptStatusDropdown_' + a.id}">
                                                        <li th:each="s : ${statusOrder}">
                                                            <form th:action="@{/appointments/status/{id}(id=${a.id})}" method="post" class="px-2">
                                                                <input type="hidden" name="status" th:value="${s}">
                                                                <input type="hidden" name="redirect" value="/admin">
                                                                <button type="submit" class="dropdown-item"
                                                                        th:text="${s}"></button>
                                                            </form>
                                                        </li>
                                                    </ul>
                                                </div>

                                                <a class="btn btn-outline-secondary btn-sm"
                                                   th:href="@{/appointments/agenda(date=${a.startAt.toLocalDate()})}">
                                                    Ver
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="text-muted small mt-2" th:if="${upcomingAppointments.size() > 8}">
                                        <span th:text="'Mostrando 8 de ' + ${upcomingAppointments.size()} + ' (ver agenda para más)'"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="card shadow-sm h-100">
                            <div class="card-header py-3">
                                <div class="fw-semibold">Estados de hoy</div>
                            </div>
                            <div class="card-body">
                                <div class="d-flex flex-column gap-2">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge text-bg-primary">Creadas</span>
                                        <span class="fw-semibold" th:text="${todayCounts['CREATED']}">0</span>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">Confirmadas</span>
                                        <span class="fw-semibold" th:text="${todayCounts['CONFIRMED']}">0</span>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge text-bg-danger">Canceladas</span>
                                        <span class="fw-semibold" th:text="${todayCounts['CANCELED']}">0</span>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="badge text-bg-success">Completadas</span>
                                        <span class="fw-semibold" th:text="${todayCounts['COMPLETED']}">0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

    </div>
</div>

<!-- Bootstrap JS -->
<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
